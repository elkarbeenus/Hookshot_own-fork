# LaküenRecomp device profile: Steam Deck (LCD and OLED). Applied by the builder when the player agrees; their settings
# before it are kept in hookshot_options.ini.before-profile and hookshot_env.txt.before-profile.
# Raise version when the values change: the builder then offers the profile again.
[profile]
title = Steam Deck
version = 2

[options]
# the game's handheld picture (1536x864) and lighter settings, a fixed 50 % render share, 2x frame generation, paced
handheld_profile = 1
resolution = 4
frame_generation = 2
frame_pacing = 1
# shadows at half size (Medium), the PC's tester's pick; Low, Very low or Off cost less
shadow_quality = 1

[env]
# (shadow maps are drawn at half size on AMD handhelds by default; LAKUEN_SHADOWS=0 turns them off)
