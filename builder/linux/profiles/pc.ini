# LaküenRecomp device profile: a desktop PC with a graphics card of 8 GB or less (an RX 6600 XT). See steamdeck.ini.
[profile]
title = PC (8 GB graphics card)
version = 2

[options]
# docked, Output 1920x1080 (the textures keep their room), a fixed 75 % render share, 2x frame generation, paced
handheld_profile = 0
output_res = 1920x1080
resolution = 2
frame_generation = 2
frame_pacing = 1
# no shadows: on the 6600 XT the render thread is the limit, and Off saves the shadow passes' draw calls (the market's
# quick camera turns no longer drag); Medium (1) keeps soft shadows
shadow_quality = 4

[env]
# the draws recorded on 3 threads: the render thread is the 6600 XT PC's limit (castle 10.6 -> 9.1 ms a frame)
RX_VK_PARALLEL=3
