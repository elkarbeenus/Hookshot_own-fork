# LaküenRecomp device profile: Lenovo Legion Go S (Ryzen Z2 Go). See steamdeck.ini for how profiles work.
[profile]
title = Legion Go S
version = 4

[options]
# (version 3, the lighter test) the game's handheld picture (1536x864), a fixed 67 % render share, 2x frame generation, paced
handheld_profile = 1
resolution = 3
frame_generation = 2
frame_pacing = 1
# the game's own upscaler (AMD FSR 3.1 took ~3.6 ms of a Steam Deck's frame)
dlss = 0
# no shadows, the console's own texture filtering
shadow_quality = 4
anisotropic_filtering = 0
# (version 4) Effect pass 1 and the ground fog left out (the menu brings them back at once); the two passes without which
# walls turned white are always drawn
effect_pass_1 = 0
ground_fog = 0

[env]
# recorded on 2 threads (of the handheld's 4 cores)
RX_VK_PARALLEL = 2
