# LaküenRecomp device profile: Lenovo Legion Go S (Ryzen Z2 Go). See steamdeck.ini for how profiles work.
[profile]
title = Legion Go S
version = 3

[options]
# (version 3, the lighter test) the game's handheld picture (1536x864), a fixed 67 % render share, 2x frame generation, paced
handheld_profile = 1
resolution = 3
frame_generation = 2
frame_pacing = 1
# the game's own upscaler (AMD FSR 3.1 took ~3.6 ms of a Steam Deck's frame)
dlss = 0
# no shadows, the console's own texture filtering
shadow_quality = 4
anisotropic_filtering = 0
# the four costliest passes after the shadows left out (each Effect pass row in the menu brings one back at once)
effect_pass_1 = 0
effect_pass_2 = 0
effect_pass_3 = 0
effect_pass_4 = 0
# shaders made as the game asks, not all at the start (those held ~4 GB of a Steam Deck's RAM)
shader_preparation = 1

[env]
# recorded on 2 threads (of the handheld's 4 cores)
RX_VK_PARALLEL = 2
